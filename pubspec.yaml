name: neptrack_core
description: Pure Dart SDK for the NepTrack REST API — vehicles, history, reports, alarms, motion logs, geofences and engine commands.
version: 0.2.0
homepage: https://neptrack.com
repository: https://github.com/NepTrack/neptrack_core

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0
  meta: ^1.11.0
  socket_io_client: ^1.0.2  # Socket.IO v2 server compatibility

dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0
